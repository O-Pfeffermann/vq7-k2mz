<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15171b" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Abruzzo Map</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="modulepreload" href="vendor/maplibre-gl.js">
<link rel="modulepreload" href="vendor/maplibre-gl-shared.js">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="app.css">
<script>
  // Before first paint: side-panel layout and the saved theme, so nothing jumps or flashes
  // when the app script takes over (same query as SIDE_QUERY in src/sheet.js).
  (function () {
    var d = document.documentElement;
    if (matchMedia("(min-width: 900px), (orientation: landscape) and (max-height: 560px)").matches) d.classList.add("layout-side");
    try {
      var th = (JSON.parse(localStorage.getItem("abruzzo-trip-mirror-v1") || "null") || {}).prefs;
      th = th && th.theme;
      if (th === "auto" || !th) th = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      d.dataset.theme = th;
    } catch (e) { /* storage blocked: the app sets the theme */ }
  })();
</script>
</head>
<body>
<div id="app">
  <main id="map" aria-label="Map of Abruzzo with recommended places"></main>

  <div id="topbar">
    <button id="status" class="status-pill" type="button"><span class="dot"></span><span class="st-text">…</span></button>
    <div id="focus-banner" class="focus-banner" hidden>
      <span class="fb-dot" aria-hidden="true"></span><span id="focus-text"></span>
      <button id="focus-exit" class="iconbtn small" type="button"></button>
    </div>
    <div id="banners"></div>
  </div>

  <div id="controls" class="controls" role="toolbar" aria-label="Map controls" aria-orientation="vertical">
    <button id="btn-zoomin" class="ctl desktop-only" type="button"></button>
    <button id="btn-zoomout" class="ctl desktop-only" type="button"></button>
    <button id="btn-compass" class="ctl" type="button" hidden></button>
    <button id="btn-layers" class="ctl" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="layers-pop"></button>
    <button id="btn-3d" class="ctl" type="button" aria-pressed="false" hidden></button>
    <button id="btn-locate" class="ctl" type="button"></button>
  </div>
  <div id="layers-pop" class="popover" role="dialog" aria-label="Map layers" hidden></div>

  <aside id="sheet" class="sheet" aria-label="Places">
    <div class="sheet-handle" role="slider" tabindex="0" aria-label="Drag to resize panel" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span></span></div>
    <div class="sheet-header">
      <div class="searchrow">
        <label class="search">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.8l-.3-.3A6.5 6.5 0 1 0 14 15.5l.3.3v.8l5 5 1.5-1.5-5-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
          <input id="q" type="search" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
          <button id="q-clear" class="iconbtn small ghost" type="button" hidden><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 6.4 17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></svg></button>
        </label>
        <button id="btn-today" class="iconbtn" type="button"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 15.2V7a4 4 0 0 0-8 0v10a2 2 0 0 1-4 0V8.8a3 3 0 1 0-2 0V17a4 4 0 0 0 8 0V7a2 2 0 0 1 4 0v8.2a3 3 0 1 0 2 0z"/></svg><span class="count" hidden></span></button>
        <button id="btn-more" class="iconbtn" type="button"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18h18v-2H3zm0-5h18v-2H3zm0-7v2h18V6z"/></svg></button>
      </div>
      <div id="chips" class="chips" role="group" aria-label="Zones"></div>
    </div>
    <div id="sheet-body" class="sheet-body" tabindex="-1"></div>
  </aside>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="modal-root"></div>
  <p id="boot-error" class="boot-error" role="alert" hidden></p>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
